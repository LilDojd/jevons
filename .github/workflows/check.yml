name: Check
on:
  push:
    branches-ignore: [main]
    tags: ["**"]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702
        with:
          enable_kvm: false
      - name: Install the pinned environment
        run: |
          revision=$(jq -er '.nodes.nixpkgs.locked.rev' devenv.lock)
          nix profile add "github:NixOS/nixpkgs/$revision#devenv"
      - name: Verify
        shell: devenv shell -- bash -e {0}
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run check

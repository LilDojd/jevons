# Bounded checks avoid treating document length as evidence of poor writing.
# Guidance: https://developers.google.com/style/highlights
# https://digital.gov/guides/plain-language/writing
- name: prose-concrete-opening
  where: "**/*.md"
  each: file
  ensure: >-
    Judge only the first three prose paragraphs, ignoring headings, badges,
    tables and code blocks. They tell the intended reader what the subject does
    in concrete terms. Promotional claims and unexplained jargon that replace
    a usable explanation break this rule. Necessary technical names, exact
    limits and safety explanations do not. Do not judge presumed authorship,
    sentence length or the rest of the file.

- name: prose-standalone-setup
  where: "**/*.md"
  each: file
  ensure: >-
    Judge only the first section about installation, setup or starting use,
    up to its first four prose paragraphs and first command block. The reader
    can understand the stated actions and prerequisites without a previous
    conversation. Session handoffs, references to unprovided earlier decisions,
    and implementation or migration diary replacing instructions break this
    rule. Explicit prerequisites and relevant compatibility notes are useful,
    not diary. If there is no such section, this rule is satisfied.

- name: prose-useful-warnings
  where: "**/*.md"
  each: file
  ensure: >-
    Judge only the first section headed privacy, safety, risks or limitations,
    up to its first four prose paragraphs or list items. Warnings explain
    distinct risks, limits, consequences or protective actions. Repeated generic
    disclaimers that add no new information break this rule. Separate warnings
    about sharing, stored data, cost and execution permission are distinct and
    useful, even if they repeat a key term. Do not penalize necessary safety
    explanations or require a warning count. If there is no such section,
    this rule is satisfied.
